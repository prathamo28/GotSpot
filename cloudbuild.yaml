steps:
  # Install dependencies
  - name: 'node:18'
    entrypoint: 'npm'
    args: ['ci']

  # Build the React app
  - name: 'node:18'
    entrypoint: 'npm'
    args: ['run', 'build']

  # Upload to Cloud Storage
  - name: 'gcr.io/cloud-builders/gsutil'
    args: [
      '-m',
      'cp',
      '-r',
      'build/*',
      'gs://${_BUCKET_NAME}/'
    ]

  # Set cache headers for static assets
  - name: 'gcr.io/cloud-builders/gsutil'
    args: [
      '-m',
      'setmeta',
      '-h',
      'Cache-Control:public, max-age=31536000',
      'gs://${_BUCKET_NAME}/static/**'
    ]

  # Set cache headers for HTML files
  - name: 'gcr.io/cloud-builders/gsutil'
    args: [
      '-m',
      'setmeta',
      '-h',
      'Cache-Control:public, max-age=0',
      'gs://${_BUCKET_NAME}/*.html'
    ]

  # Invalidate CDN cache
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute url-maps invalidate-cdn-cache ${_URL_MAP_NAME} --path="/*"

substitutions:
  _BUCKET_NAME: 'gotspot-frontend-${_RANDOM_SUFFIX}'
  _URL_MAP_NAME: 'gotspot-frontend-map-${_RANDOM_SUFFIX}'
  _RANDOM_SUFFIX: '${SHORT_SHA}'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
