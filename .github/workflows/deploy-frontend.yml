name: Deploy Frontend to GCP

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west1
  BUCKET_NAME: gotspot-terraform-state

jobs:
  # Terraform Plan
  plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.0

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Terraform backend
      run: |
        echo "terraform {
          backend \"gcs\" {
            bucket = \"${{ env.BUCKET_NAME }}\"
            prefix = \"frontend/state\"
          }
        }" > terraform/backend.tf

    - name: Terraform Init
      working-directory: terraform
      run: terraform init

    - name: Terraform Validate
      working-directory: terraform
      run: terraform validate

    - name: Terraform Plan
      working-directory: terraform
      run: terraform plan -var-file="terraform.tfvars" -out=tfplan
      env:
        TF_VAR_project_id: ${{ env.PROJECT_ID }}
        TF_VAR_github_owner: ${{ github.repository_owner }}
        TF_VAR_github_repo: ${{ github.event.repository.name }}

    - name: Upload Terraform Plan
      uses: actions/upload-artifact@v4
      with:
        name: terraform-plan
        path: terraform/tfplan

  # Deploy Infrastructure
  deploy-infrastructure:
    name: 'Deploy Infrastructure'
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/dev'
    environment: dev
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.0

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Terraform backend
      run: |
        echo "terraform {
          backend \"gcs\" {
            bucket = \"${{ env.BUCKET_NAME }}\"
            prefix = \"frontend/state\"
          }
        }" > terraform/backend.tf

    - name: Terraform Init
      working-directory: terraform
      run: terraform init

    - name: Download Terraform Plan
      uses: actions/download-artifact@v4
      with:
        name: terraform-plan
        path: terraform/

    - name: Terraform Apply
      working-directory: terraform
      run: terraform apply -auto-approve tfplan
      env:
        TF_VAR_project_id: ${{ env.PROJECT_ID }}
        TF_VAR_github_owner: ${{ github.repository_owner }}
        TF_VAR_github_repo: ${{ github.event.repository.name }}

    - name: Get Terraform Outputs
      working-directory: terraform
      run: |
        echo "BUCKET_NAME=$(terraform output -raw storage_bucket_name)" >> $GITHUB_ENV
        echo "FRONTEND_URL=$(terraform output -raw frontend_url)" >> $GITHUB_ENV
        echo "IP_ADDRESS=$(terraform output -raw ip_address)" >> $GITHUB_ENV

    - name: Comment PR with deployment info
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `🚀 **Frontend Deployment Ready!**
            
            **Frontend URL:** ${{ env.FRONTEND_URL }}
            **IP Address:** ${{ env.IP_ADDRESS }}
            **Storage Bucket:** ${{ env.BUCKET_NAME }}
            
            ⚠️ **Note:** SSL certificate may take 10-15 minutes to provision.`

  # Deploy Frontend
  deploy-frontend:
    name: 'Deploy Frontend'
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    if: github.ref == 'refs/heads/dev'
    environment: dev
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build React app
      run: npm run build

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Get Terraform Outputs
      run: |
        gcloud config set project ${{ env.PROJECT_ID }}
        BUCKET_NAME=$(gcloud storage buckets list --filter="name:gotspot-frontend" --format="value(name)" | head -1)
        echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV

    - name: Upload to Cloud Storage
      run: |
        gsutil -m cp -r build/* gs://${{ env.BUCKET_NAME }}/
        
        # Set cache headers for static assets
        gsutil -m setmeta -h "Cache-Control:public, max-age=31536000" gs://${{ env.BUCKET_NAME }}/static/**
        
        # Set cache headers for HTML files
        gsutil -m setmeta -h "Cache-Control:public, max-age=0" gs://${{ env.BUCKET_NAME }}/*.html

    - name: Invalidate CDN Cache
      run: |
        URL_MAP_NAME=$(gcloud compute url-maps list --filter="name:gotspot-frontend-map" --format="value(name)" | head -1)
        gcloud compute url-maps invalidate-cdn-cache $URL_MAP_NAME --path="/*"

    - name: Deployment Summary
      run: |
        echo "🎉 Frontend deployed successfully!"
        echo "📦 Bucket: ${{ env.BUCKET_NAME }}"
        echo "🌐 URL: https://${{ env.BUCKET_NAME }}.storage.googleapis.com"
        echo "⏰ CDN cache invalidated"
